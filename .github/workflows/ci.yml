name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install native libraries
        run: sudo apt-get update && sudo apt-get install -y libexpat1 libxext6 libxrender1

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Validate artifact-builder interface
        run: python scripts/build_applicability_artifacts.py --help

      - name: Run inference smoke test
        run: python tests/smoke_test.py

      - name: Test initial Streamlit render
        run: python tests/streamlit_startup_test.py

      - name: Test activity profile
        run: python tests/activity_profile_test.py

      - name: Test applicability interface
        run: python tests/streamlit_aas_test.py
